<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- 極簡純淨底色 -->
  <rect width="512" height="512" rx="100" fill="#f8fafc"/>
  
  <!-- 內圈精緻戰術邊框 -->
  <rect x="20" y="20" width="472" height="472" rx="80" fill="none" stroke="#e2e8f0" stroke-width="4"/>

  <!-- 軍武立體海錨主體 -->
  <g transform="translate(0, -20)">
    <!-- 頂部吊環 (Ring) -->
    <circle cx="256" cy="85" r="32" fill="none" stroke="#0f172a" stroke-width="22"/>
    <circle cx="256" cy="85" r="16" fill="#f8fafc"/>

    <!-- 橫桿 (Stock) -->
    <path d="M140 145 L372 145" stroke="#0f172a" stroke-width="24" stroke-linecap="round"/>
    <circle cx="140" cy="145" r="16" fill="#0f172a"/>
    <circle cx="372" cy="145" r="16" fill="#0f172a"/>

    <!-- 主軸 (Shank) -->
    <path d="M256 95 L256 315" stroke="#0f172a" stroke-width="26" stroke-linecap="square"/>

    <!-- 錨弧與錨爪 (Arms & Flukes) -->
    <path d="M120 220 C120 340 392 340 392 220" fill="none" stroke="#0f172a" stroke-width="28" stroke-linecap="round"/>
    
    <!-- 左右兩端錨爪三角 (Flukes) -->
    <polygon points="120,220 95,255 145,255" fill="#0f172a"/>
    <polygon points="392,220 367,255 417,255" fill="#0f172a"/>
    
    <!-- 底部錨冠加強塊 (Crown) -->
    <rect x="236" y="305" width="40" height="25" rx="6" fill="#0f172a"/>
  </g>

  <!-- 下排文字：TAIWAN (黑色) -->
  <text x="256" y="420" 
        text-anchor="middle" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Arial Black', sans-serif" 
        font-size="44" 
        font-weight="900" 
        letter-spacing="5" 
        fill="#000000">TAIWAN</text>

  <!-- 下排文字：NAVY (海軍藍) -->
  <text x="256" y="468" 
        text-anchor="middle" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Arial Black', sans-serif" 
        font-size="38" 
        font-weight="900" 
        letter-spacing="7" 
        fill="#003366">NAVY</text>
</svg>
